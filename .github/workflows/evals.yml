name: evals

# The eval suite costs real money: a crew-arm run is 5 to 8 minutes and 2 to
# 4 dollars, a baseline run about 90 seconds and 35 cents (measured on the
# Purser case, 2.13.0). The full suite at one run per arm is roughly 40
# dollars and 90 minutes; at three runs per arm, triple that. So it runs
# only when started by hand from the Actions tab, at one run per arm unless
# asked. It needs an ANTHROPIC_API_KEY repository secret, and every run
# bills that key per token. Running the same command on a laptop logged in
# to Claude Code bills the subscription instead, which is the cheap route;
# AGENTS.md section 6 has the command.

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Case glob, e.g. purser* (empty = whole suite)"
        default: ""
      max_cost_usd:
        description: "Cost cap for the run"
        default: "50"
      runs:
        description: "Runs per arm (1 = smoke, 3 = the real score)"
        default: "1"

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Is there an API key?
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set as a repository secret, so the eval suite was skipped. Add it under Settings, Secrets and variables, Actions to run it here."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
      - if: steps.key.outputs.present == 'true'
        run: pip install -q -r plugins/crew/evals/_fixture/schoolapp/requirements.txt
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: "22"
      - if: steps.key.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Sandbox backend the harness needs to confine Bash
        if: steps.key.outputs.present == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap socat
      - name: Run the suite
        if: steps.key.outputs.present == 'true'
        working-directory: plugins/crew
        run: |
          CASE="${{ github.event.inputs.case }}"
          COST="${{ github.event.inputs.max_cost_usd || '50' }}"
          RUNS="${{ github.event.inputs.runs || '1' }}"
          ARGS=(. --scaffold --trust-plugin --allow-tools Bash Write Edit --judge-model sonnet --max-cost-usd "$COST" --runs "$RUNS")
          if [ -n "$CASE" ]; then ARGS+=(--case "$CASE"); fi
          claude plugin eval "${ARGS[@]}"
      - name: Keep the report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_number }}
          path: plugins/crew/evals/results/
          if-no-files-found: warn
