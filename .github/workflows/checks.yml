name: checks

on:
  push:
  pull_request:

jobs:
  hooks-and-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Django so the migration check in before_stop is covered
        run: pip install -q django
      - name: Hook selftest
        run: python3 plugins/crew/hooks/selftest.py
      - name: Word budgets
        run: python3 tools/budget.py
