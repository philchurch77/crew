name: checks

on:
  push:
  pull_request:

jobs:
  hooks-and-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Django so the migration check in before_stop is covered
        run: pip install -q django
      - name: Hook selftest
        run: python3 plugins/crew/hooks/selftest.py
      - name: Word budgets
        run: python3 tools/budget.py
      - name: Install what the reference projects need
        run: pip install -q -r plugins/crew/skills/new-project/reference/requirements.txt anthropic PyYAML
      - name: The references run
        run: bash tools/check_references.sh
